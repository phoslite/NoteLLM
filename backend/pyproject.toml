[project]
name = "llmnotebook-backend"
version = "0.1.0"
description = "读书阅读助手后端（M2 骨架）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "pymupdf>=1.28",
    "ebooklib>=0.18",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]